spring.application.name=audit-log-service

audit.retention-days=${AUDIT_RETENTION_DAYS:90}
audit.redaction.master-key-base64=${AUDIT_REDACTION_MASTER_KEY_BASE64:}

spring.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/auditlog}
spring.datasource.username=${POSTGRES_USER:auditlog}
spring.datasource.password=${POSTGRES_PASSWORD:auditlog}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
